#
# gedad configuration. Every line is `key = value`; `#` starts a comment.
#
# Every key here can also be set as an environment variable with a GEDA_
# prefix (GEDA_DEST=/srv/photos), which is how the Docker image is configured,
# or on the command line with `gedad run -set dest=/srv/photos`. Later sources
# win: file, then environment, then flags.
#
# Nothing in this file is required. gedad works with no configuration at all;
# these are the settings worth knowing about.

# What phones see when they pick a destination. Defaults to the hostname.
#name = Living Room NAS

# Where received files are stored. Defaults to <state_dir>/Photos.
#dest = /srv/photos

# The ledger, the TLS identity, and the control socket.
#
# This directory must survive updates. The identity key lives here, and a
# receiver that loses it looks like a different machine to every paired
# phone -- which is a hard failure with no override, fixed only by re-pairing
# every device.
#state_dir = /var/lib/geda

# TLS listen address for transfers.
#listen = :47891

# UDP port discovery probes arrive on.
#discovery_port = 47890

# The port peers are told to connect to. Only differs from the listen port
# behind a port mapping -- a container published on a different host port.
#advertise_port = 47891

# The addresses peers are told to connect to, comma separated.
#
# Leave this unset on a normal install: gedad advertises every local address,
# VPN interfaces included, which is what lets a phone on another network reach
# it over WireGuard with no configuration.
#
# Set it when the machine cannot see the address peers reach it on: a bridged
# container sees only a private bridge address that nobody outside can dial.
#advertise = 192.168.1.10, 10.8.0.1

# Answer discovery probes (the unicast, broadcast, and multicast layers).
#discovery = true

# Announce over mDNS/Bonjour. Turn this off if Avahi already owns port 5353;
# the unicast layers keep working either way.
#mdns = true

# How received files are named. Variables: {yyyy} {MM} {dd} {HH} {mm} {ss}
# {original_name} {device} {album} {counter} {hash8} {ext}
#naming_template = {yyyy}-{MM}-{dd}_{HH}{mm}{ss}_{original_name}.{ext}

# debug, info, warn, or error.
#log_level = info

# The socket `gedad pair` and `gedad status` talk to. Defaults to
# <state_dir>/gedad.sock.
#control_socket = /run/geda/gedad.sock
