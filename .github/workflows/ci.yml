name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # The race detector is where the ledger's concurrency assumptions are
      # actually checked, so it runs everywhere rather than on one platform.
      - run: go test -race -count=1 ./...

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # Windows is not in the matrix: gedad is the headless daemon for NAS and
      # Linux boxes, and its control socket is a Unix socket. Windows users get
      # the desktop app, which is built in P6.
      - run: go test -race -count=1 ./...

      # The daemon has to build for every machine the Docker image and the
      # packaged binaries target, from one host and with no cgo toolchain.
      - name: build all targets
        if: runner.os == 'Linux'
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "==> $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  mobile:
    name: mobile
    # macOS because the app is iOS-only and the pinning check builds Swift.
    # Nothing here needs a device: src/core is plain TypeScript on purpose.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A syntax and type check of the native module. Building it needs the
      # iOS platform, which is what the EAS build does; this catches the class
      # of mistake that would otherwise surface half an hour into one.
      - name: native module
        run: |
          set -e
          for file in modules/geda-transfer/ios/*.swift; do
            swiftc -parse "$file"
          done
          swiftc -typecheck -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            modules/geda-transfer/ios/SPKIPin.swift \
            modules/geda-transfer/ios/PinnedClient.swift


  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # core/ must build for every target the desktop app, gedad, and the
      # Docker image ship to, from one machine and with no cgo toolchain.
      # A dependency that quietly needs cgo would break NAS builds.
      - name: build all targets
        run: |
          set -e
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  gates:
    name: phase gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Each phase's gate from docs/PLAN.md is scripted so it is checked
      # against a real server over real TLS, not only in Go tests.
      - run: ./scripts/verify-p1.sh

      # P2 needs two subnets and a router between them, which is why this one
      # runs in Docker rather than against loopback.
      - run: ./scripts/verify-p2.sh

      # P3 runs the real product image, so this is also what proves the
      # published Dockerfile builds and works.
      - run: ./scripts/verify-p3.sh

      # P4's gate is a measured number from a physical iPhone, so this step
      # fails until a run is recorded in docs/PERFORMANCE.md. That is the
      # point: an unmeasured performance gate is not a passed one.
      - run: ./scripts/verify-p4.sh

  licence:
    name: licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-headers.sh
