name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # The race detector is where the ledger's concurrency assumptions are
      # actually checked, so it runs everywhere rather than on one platform.
      - run: go test -race -count=1 ./...

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # Windows is not in the matrix: gedad is the headless daemon for NAS and
      # Linux boxes, and its control socket is a Unix socket. Windows users get
      # the desktop app, which is built in P6.
      - run: go test -race -count=1 ./...

      # The daemon has to build for every machine the Docker image and the
      # packaged binaries target, from one host and with no cgo toolchain.
      - name: build all targets
        if: runner.os == 'Linux'
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "==> $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  mobile:
    name: mobile
    # macOS because the app is iOS-only and the pinning check builds Swift.
    # Nothing here needs a device: src/core is plain TypeScript on purpose.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A syntax and type check of the native module. Building it needs the
      # iOS platform, which is what the EAS build does; this catches the class
      # of mistake that would otherwise surface half an hour into one.
      #
      # The module and the app-delegate subscriber import ExpoModulesCore and
      # can only be parsed here. Everything else imports system frameworks
      # only, so it is fully typechecked -- against the *iOS* SDK, because
      # ActivityKit and BackgroundTasks do not exist on macOS.
      - name: native module
        run: |
          set -e
          for file in modules/geda-transfer/ios/*.swift ios-extensions/GedaLiveActivity/*.swift; do
            swiftc -parse "$file"
          done
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd modules/geda-transfer/ios
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.4 \
            SPKIPin.swift PinnedClient.swift Tus.swift BackgroundStore.swift \
            BackgroundUploader.swift LiveActivity.swift GedaTransferAttributes.swift \
            DownloadStore.swift BackgroundDownloader.swift AssetLibrary.swift
          cd -
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.4 \
            ios-extensions/GedaLiveActivity/GedaLiveActivity.swift \
            modules/geda-transfer/ios/GedaTransferAttributes.swift


  desktop:
    name: desktop (${{ matrix.os }})
    # macOS and Windows only: the desktop app is for those two, and its
    # webview is the platform's own. Linux would need GTK headers to build a
    # binary nobody ships.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # The page is embedded into the binary, so it has to exist before the Go
      # build runs. Its own typecheck is the first thing that fails if a
      # binding was renamed on the Go side.
      - name: build the window
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race -count=1 ./...

      # A development build must keep its own state directory: pairing writes
      # a TLS identity, and damaging the installed app's makes every paired
      # phone fail with a pin mismatch that has no override.
      - run: go test -count=1 -tags dev ./internal/settings/

      # What the window shows, as opposed to what the receiver does.
      - name: the window's own tests
        working-directory: desktop/frontend
        run: npm run test


  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # core/ must build for every target the desktop app, gedad, and the
      # Docker image ship to, from one machine and with no cgo toolchain.
      # A dependency that quietly needs cgo would break NAS builds.
      - name: build all targets
        run: |
          set -e
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  gates:
    name: phase gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Each phase's gate from docs/PLAN.md is scripted so it is checked
      # against a real server over real TLS, not only in Go tests.
      - run: ./scripts/verify-p1.sh

      # P2 needs two subnets and a router between them, which is why this one
      # runs in Docker rather than against loopback.
      - run: ./scripts/verify-p2.sh

      # P3 runs the real product image, so this is also what proves the
      # published Dockerfile builds and works.
      - run: ./scripts/verify-p3.sh

      # P4's gate is a measured number from a physical iPhone. The script
      # checks everything around it; the number itself is reported, because no
      # commit could turn it green here and a permanently red check is one
      # nobody reads.
      - run: ./scripts/verify-p4.sh

      # Which device measurements are still missing, kept visible without
      # blocking: this step is expected to be red until somebody with a phone
      # records a run, and says so in its own log rather than by failing the
      # workflow. An unmeasured gate is still not a passed one.
      - name: recorded measurements (needs hardware, informational)
        continue-on-error: true
        run: ./scripts/check-measurements.sh --strict

  gate-p5:
    name: phase gate P5
    # Its own job, on macOS: P5's gate needs the iOS SDK for the native
    # sources and a Go toolchain for the receiver it resumes an upload
    # against. The other gates need neither and run on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Checks the protocol half of the gate -- an upload resumed by a client
      # that shares nothing with the first but the URL, verified by hash. The
      # device half is a person with a phone, recorded in docs/PERFORMANCE.md.
      - run: ./scripts/verify-p5.sh

  gate-p6:
    name: phase gate P6
    # macOS: the gate builds the desktop app, whose webview is the platform's.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Drives a real pairing and a real upload through the same bindings the
      # window calls. The half of the gate that is a person is not claimed by
      # the script and is recorded in docs/PERFORMANCE.md.
      - run: ./scripts/verify-p6.sh

  gate-p7:
    name: phase gate P7
    # macOS: the gate typechecks the download session against the iOS SDK, and
    # runs a Go receiver for the protocol half.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # A 2 GiB file queued, collected, interrupted, resumed by range, and
      # verified against the digest the receiver published. The half of the
      # gate that is two places on a phone is recorded in docs/PERFORMANCE.md.
      #
      # 512 MiB here rather than the gate's 2 GiB: a hosted runner's disk is
      # 14 GB and the run writes the file twice. The size only changes how
      # long the loopback transfer takes -- every code path, including the
      # interruption and the resume, is the same at either size -- and the
      # 2 GiB run is what the phase is signed off on locally.
      - run: ./scripts/verify-p7.sh --size 536870912

  gate-p8:
    name: phase gate P8
    # Ubuntu: unlike P5 and P7, P8's gate needs no iOS SDK to prove its
    # sentence -- both halves are properties of the receiver. The native
    # sources are typechecked in the `mobile` job on macOS, and the script
    # skips them here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # A Live Photo pair and a ProRAW negative through a real receiver under
      # every preset, twice: once with no converter installed and once with
      # one. The second run is the only configuration in which "space-saving
      # did not delete half a Live Photo" means anything.
      #
      # A stand-in converter rather than a real ffmpeg, on purpose: what is
      # being gated is which file the receiver writes and which original it
      # keeps, and that must hold on every machine.
      - run: ./scripts/verify-p8.sh


  gate-p10:
    name: phase gate P10
    # Ubuntu: P10's gate is about what the app *declares* and what the
    # repository offers, both of which are text. The binary those declarations
    # end up in is built by EAS, and the native sources are typechecked in the
    # `mobile` job on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: install
        working-directory: mobile
        run: npm ci

      # The submission answers checked against the configuration they describe:
      # purpose strings, background modes, the privacy manifest, the dossier
      # that quotes them, and the repository a stranger arrives at. Not
      # `--strict`: the screenshots are pictures of a built app on a real
      # screen and are reported rather than invented.
      - run: ./scripts/verify-p10.sh

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Contributions are accepted under the Developer Certificate of Origin
      # (CONTRIBUTING.md). It is certified by a sign-off line and by nothing
      # else, so an unsigned commit is a patch we have no statement of
      # provenance for.
      - name: every commit carries a sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0

          # Collected before the loop, and checked: a command substitution
          # that fails inside a `for` list is not fatal, so a rev-list that
          # errored would leave an empty list and pass this job vacuously.
          if ! commits=$(git rev-list --no-merges "$BASE".."$HEAD"); then
            echo "::error::could not list the commits between $BASE and $HEAD"
            exit 1
          fi
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          # Merge commits are excluded: GitHub writes them, and nobody can
          # sign off on a commit they did not author.
          for sha in $commits; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format=%B "$sha" | grep -qi "^Signed-off-by: .\+ <.\+@.\+>"; then
              continue
            fi
            echo "::error::$sha is not signed off ($author)"
            git show -s --format='  %h %s' "$sha"
            missing=$((missing + 1))
          done

          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing commit(s) have no Signed-off-by line."
            echo
            echo "Contributions are accepted under the Developer Certificate of"
            echo "Origin (CONTRIBUTING.md). Sign off with 'git commit -s'; to fix"
            echo "what is already committed:"
            echo
            echo "    git commit --amend -s              # the last commit"
            echo "    git rebase --signoff origin/main   # a whole branch"
            exit 1
          fi
          echo "Every commit in this pull request is signed off."

  licence:
    name: licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-headers.sh
