#
# Two subnets joined by a router, which is the topology the P2 gate is about.
#
# The router forwards unicast IP and nothing else. Broadcast stops at its
# subnet, and mDNS is multicast with TTL=1 so it never leaves either segment --
# exactly like a real router, and exactly like a WireGuard tunnel, which has no
# broadcast domain at all. What is left is the unicast sweep and the candidate
# set, which is what this gate exists to prove.
#
# The addresses are RFC 5737 documentation ranges (TEST-NET-2 and TEST-NET-3),
# reserved precisely so they never appear on a real network. This is not
# cosmetic: a Docker bridge that overlaps a subnet the host is actually on
# steals the host's route to it, and the developer's machine loses its LAN and
# its internet for as long as the network exists. docs/PLAN.md describes the
# gate with 192.168.11.x and 192.168.12.x -- do not use those here, they are
# ordinary home-router ranges and one of them will eventually be somebody's
# actual network. scripts/verify-p2.sh refuses to run if these overlap the
# host.

name: geda-p2-gate

networks:
  subnet-a:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  subnet-b:
    ipam:
      config:
        - subnet: 203.0.113.0/24

services:
  router:
    image: alpine:3.21
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      subnet-a:
        ipv4_address: 198.51.100.2
      subnet-b:
        ipv4_address: 203.0.113.2
    command: ["sleep", "infinity"]

  peer-a:
    build:
      context: ../..
      dockerfile: test/cross-subnet/Dockerfile
    depends_on: [router]
    cap_add: [NET_ADMIN]
    networks:
      subnet-a:
        ipv4_address: 198.51.100.20
    command:
      - |
        ip route replace 203.0.113.0/24 via 198.51.100.2
        exec gatepeer -dir /state -id peer-a -name "Peer A" \
          -sweep 203.0.113.0/24 -expect peer-b -scan 3s

  peer-b:
    build:
      context: ../..
      dockerfile: test/cross-subnet/Dockerfile
    depends_on: [router]
    cap_add: [NET_ADMIN]
    networks:
      subnet-b:
        ipv4_address: 203.0.113.30
    command:
      - |
        ip route replace 198.51.100.0/24 via 203.0.113.2
        exec gatepeer -dir /state -id peer-b -name "Peer B" \
          -sweep 198.51.100.0/24 -expect peer-a -scan 3s
