#
# The P3 gate: the product container receives an upload from a client on
# another subnet.
#
# Two Docker networks with a routing container between them, the same shape as
# the P2 harness. The router is not decoration: Docker Engine installs
# DOCKER-ISOLATION rules that drop forwarding between two bridge networks, so
# a client on one bridge cannot reach a receiver on the other however the
# routing table is written. Every hop here is within one bridge -- client to
# router, then router to receiver -- and the crossing happens inside the
# router, which is what a home router or a VPN gateway does.
#
# The router also masquerades, so the receiver replies on-link to the router
# rather than needing a route of its own. That keeps the receiver container
# exactly as shipped: same image, same unprivileged user, same entrypoint, no
# capabilities added and no test code inside it.
#
# The addresses are RFC 5737 documentation ranges (TEST-NET-2 and TEST-NET-3),
# for the same reason as the P2 harness: a Docker bridge that overlaps a
# network the host is really on steals the host's route to it, and the
# developer loses their LAN. scripts/verify-p3.sh refuses to run if these
# overlap an address on this machine.

name: geda-p3-gate

networks:
  client-net:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  nas-net:
    ipam:
      config:
        - subnet: 203.0.113.0/24

services:
  # The boundary between the two subnets.
  router:
    image: alpine:3.21
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      client-net:
        ipv4_address: 198.51.100.2
      nas-net:
        ipv4_address: 203.0.113.2
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache iptables >/dev/null
        iptables -t nat -A POSTROUTING -s 198.51.100.0/24 -d 203.0.113.0/24 -j MASQUERADE
        sleep infinity

  # The receiver, running the real product image exactly as shipped: same
  # entrypoint, same unprivileged user, no test harness inside it.
  gedad:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: geda/gedad:gate
    depends_on: [router]
    networks:
      nas-net:
        ipv4_address: 203.0.113.30
    environment:
      GEDA_NAME: "Gate NAS"
      # The bridged-container case from docker/compose.bridge.yml: the only
      # address the container can see is its own bridge address, so the
      # address peers should dial is configured explicitly.
      GEDA_ADVERTISE: "203.0.113.30"
      GEDA_MDNS: "false"
    volumes:
      - state:/state
      - data:/data

  # Stands in for a phone on another network. It gets curl, openssl, and a
  # route to the receiver's subnet: everything it does, a mobile client can do.
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on: [router]
    cap_add: [NET_ADMIN]
    networks:
      client-net:
        ipv4_address: 198.51.100.20
    command:
      - /bin/sh
      - -c
      - |
        ip route replace 203.0.113.0/24 via 198.51.100.2
        sleep infinity

volumes:
  state:
  data:
